  <rect x="33.0" y="26.0" width="14" height="54" rx="7.0" opacity="0.72"/>
  <rect x="51.0" y="20.0" width="14" height="60" rx="7.0" opacity="1"/>
  <rect x="69.0" y="38.0" width="14" height="42" rx="7.0" opacity="0.42"/>
</svg>
