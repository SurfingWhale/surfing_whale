<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="currentColor">
  <title>Surfing Whale</title>
  <!-- The favicon cut. Same wave, four bars instead of seven, because at 32px
       the full mark's bars fall under three pixels and smear together. -->
