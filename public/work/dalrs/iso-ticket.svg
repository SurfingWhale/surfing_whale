<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -4 49 32" role="img" aria-label="Ikon isometrik: ticket"><title>Ikon isometrik: ticket</title><style>.f-top{fill:#fff}.f-left{fill:#e8eaee}.f-right{fill:#cfd3d9}
.f-dark-top{fill:#3a3d43}.f-dark-left{fill:#24262b}.f-dark-right{fill:#15161a}
.f-wood-top{fill:#e4e1da}.f-wood-left{fill:#cfcac0}.f-wood-right{fill:#b9b3a7}
.edge{stroke:#000;stroke-width:1.3;stroke-linejoin:round}.thin{stroke-width:.9}
.tape{stroke:#f5a623}.tape-shade{stroke:#e39612}.tape-fill{fill:#f5a623}
.paper{fill:#fff;stroke:#000;stroke-width:1}
.screen{fill:#15161a;stroke:#000;stroke-width:1}.screen-line{stroke:#f5a623;stroke-width:1.2}
.vent{stroke:#000;stroke-width:.8;opacity:.5}
.cable{fill:none;stroke:#000;stroke-width:1.4;opacity:.7}
.ink{fill:#000}.soft{fill:#c7cbd1}
.floor path{stroke:#c7cbd1;stroke-width:1;stroke-dasharray:2 5}
.leader{stroke:#000;stroke-width:1;stroke-dasharray:3 3;fill:none}
.iso-text{font:600 9px ui-monospace,Menlo,monospace;fill:#000}
.slab-label{font-size:11px}
/* text.on-dark, not .on-dark: the label on the dark slab carries both
   .iso-text (fill #000) and .on-dark (fill #fff), two single-class rules of
   equal weight, so whichever is written last wins. Flattening the stylesheet
   moved .on-dark above .iso-text once and the Firestore label went black on
   black. The element selector settles it by weight instead of by order. */
text.on-dark{fill:#fff}
.beam{fill:#f5a623;opacity:.28}
.beam-line{stroke:#f5a623;stroke-width:1.5;opacity:.28}
.rollers{stroke:#000;stroke-width:1;stroke-dasharray:2 6}
.route{fill:none;stroke:#000;stroke-width:1.4;stroke-dasharray:6 6;opacity:.55}
.pulse{fill:none;stroke:#f5a623;stroke-width:2;opacity:.45}
.belt-item{opacity:1}.belt-item:not(:first-of-type){display:none}</style><path class="f-left edge thin" d="M-15.2 8.8L12.5 24.8L12.5 23.5L-15.2 7.5Z"/><path class="f-right edge thin" d="M27.7 16.0L12.5 24.8L12.5 23.5L27.7 14.7Z"/><path class="f-top edge thin" d="M0.0 -1.3L27.7 14.7L12.5 23.5L-15.2 7.5Z"/><g transform="matrix(0.8660 0.5 -0.8660 0.5 -0.7 1.5)"><rect x="0" y="0" width="1.6" height="18" class="ink"/><rect x="3" y="0" width="1.6" height="18" class="ink"/><rect x="5" y="0" width="1.6" height="18" class="ink"/><rect x="9" y="0" width="1.6" height="18" class="ink"/><rect x="12" y="0" width="1.6" height="18" class="ink"/><rect x="14" y="0" width="1.6" height="18" class="ink"/><rect x="18" y="0" width="1.6" height="18" class="ink"/><rect x="21" y="0" width="1.6" height="18" class="ink"/><rect x="30" y="2" width="16" height="4" class="soft"/></g></svg>
